<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intro demo v3: sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#fcfcfc;--sand-1:#f4ede4;--sand-2:#eadfd1;--sand-3:#dccbb8;--sand-ink:#6e5b48;--ink:#000;--soft:#4c4c4c;--sketch:var(--sand-ink);--font:"Helvetica Neue",Helvetica,Arial,sans-serif;--hand:"Caveat",cursive;--ease:cubic-bezier(.16,1,.3,1)}
body{margin:0;background:var(--page);font-family:var(--font);color:var(--ink)}
.page{max-width:1200px;margin:0 auto;padding:120px 24px}
.page h1{font-size:34px;letter-spacing:-.02em;margin:0 0 12px}
.page p{font-size:17px;color:var(--soft);max-width:560px}
button{position:fixed;right:16px;bottom:16px;z-index:200;font:600 14px var(--font);padding:10px 16px;border-radius:999px;border:0;background:#111;color:#fff;cursor:pointer}

.veil{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--page);pointer-events:none;
  animation:lift 420ms cubic-bezier(.76,0,.24,1) 2700ms forwards}
.stage{position:relative;padding:26px 38px}
.mark{position:absolute;left:22px;right:22px;top:44%;height:42%;background:var(--sand-3);border-radius:6px;transform-origin:0 50%;scale:0 1;animation:swipe 520ms cubic-bezier(.6,0,.2,1) 380ms forwards}
.name{position:relative;overflow:hidden;line-height:1.2}
.name span{display:block;font-size:46px;font-weight:700;letter-spacing:-.02em;transform:translateY(110%);animation:rise 560ms var(--ease) 120ms forwards}
.ink{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;fill:none;stroke:var(--sketch);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ink path{stroke-dasharray:1;stroke-dashoffset:1}
.ink .ring{animation:draw 760ms cubic-bezier(.45,.05,.25,1) 560ms forwards}
.ink .arrow{animation:draw 420ms ease-out 1650ms forwards}
.ink .scribble{stroke-width:4.5;animation:draw 380ms cubic-bezier(.5,0,.3,1) 2150ms forwards}
.ink .head{animation:draw 200ms ease-out 2000ms forwards}
.note{position:absolute;left:62%;top:calc(100% + 14px);font-family:var(--hand);font-weight:600;font-size:32px;line-height:1;color:var(--sketch);white-space:nowrap;rotate:-4deg;
  clip-path:inset(-10% 100% -10% 0);animation:write 560ms steps(14,end) 1350ms forwards}
@keyframes swipe{to{scale:1 1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes write{to{clip-path:inset(-10% -4% -10% 0)}}
@keyframes rise{to{transform:none}}
@keyframes lift{to{transform:translateY(-100%);visibility:hidden}}
.page h1,.page p{animation:rise2 700ms var(--ease) 2850ms both}
@keyframes rise2{from{opacity:0;translate:0 8px}}
@media (max-width:600px){.name span{font-size:34px}.note{font-size:26px}.stage{padding:20px 28px}}
</style></head><body>
<div class="page" id="page"><h1>I'm Dev, a product designer</h1><p>The page underneath. Its own words come in as the screen lifts.</p></div>
<div id="slot"></div>
<button onclick="play()">Replay</button>
<script>
function play(){
  var p=document.getElementById('page'),n=p.cloneNode(true);p.replaceWith(n);
  document.getElementById('slot').innerHTML='<div class="veil"><div class="stage"><div class="mark"></div><div class="name"><span>Dev Dixit</span></div>'
  +'<svg class="ink" viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true">'
  +'<path class="ring" pathLength="1" vector-effect="non-scaling-stroke" d="M268 22 C 238 2, 90 -2, 40 24 C 4 44, 20 88, 146 92 C 262 96, 298 64, 280 34 C 272 20, 248 10, 214 6"/>'
  +'<path class="arrow" pathLength="1" vector-effect="non-scaling-stroke" d="M236 118 C 232 104, 246 98, 250 90"/>'
  +'<path class="head" pathLength="1" vector-effect="non-scaling-stroke" d="M242 96 L250 90 L256 99"/>'
  +'<path class="scribble" pathLength="1" vector-effect="non-scaling-stroke" d="M-6 78 L300 14 L-2 52 L304 34 L2 92 L306 58 L6 24 L300 88"/>'
  +'</svg><div class="note">product designer</div></div></div>';
}
play();setInterval(play,4600);
</script></body></html>
